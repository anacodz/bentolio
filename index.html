  <body>
    <script>
      // Remove ChatGPT link-tracking from the visible URL while preserving other parameters.
      (function () {
        const url = new URL(window.location.href);
        if (url.searchParams.has('utm_chatgpt')) {
          url.searchParams.delete('utm_chatgpt');
          window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
